name: nightly legacy archive check

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r publishing/requirements-legacy.txt
      - name: Check cards, manifests, diagrams, and checksums
        run: python publishing/maintain_legacy_archive.py --check
      - name: Check canonical technical metadata
        run: python publishing/validate_legacy_metadata.py
