name: refresh npm download metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-npm-downloads
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh machine-readable download metadata
        run: python scripts/generate_npm_downloads_diagram.py --json-output docs/marama-route-npm-downloads.json
      - name: Commit updated metadata
        run: |
          if git diff --quiet -- docs/marama-route-npm-downloads.json; then
            echo "No download metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/marama-route-npm-downloads.json
          git commit -m "chore: refresh npm download metadata"
          git push
